<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="TheDiscomBill">
  <!-- Maskable variant: full-bleed square (Android crops it to whatever shape the launcher
       uses), with the bolt held inside the 80% safe zone so no crop clips it. Same royal-blue
       and amber palette as favicon.svg and icon.svg so the installed app icon matches the
       browser tab — but deliberately NOT a copy of them: those carry rounded corners, which
       would be double-rounded once the launcher applies its own mask. The gradient centre is
       nudged toward the true middle here, since a launcher may crop this to a circle. -->
  <defs>
    <radialGradient id="mbg" cx="0.5" cy="0.4" r="0.85">
      <stop offset="0" stop-color="#5c76ca"/>
      <stop offset="0.55" stop-color="#4160b5"/>
      <stop offset="1" stop-color="#26418f"/>
    </radialGradient>
    <linearGradient id="mbolt" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f7c34e"/>
      <stop offset="1" stop-color="#ee9a26"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#mbg)"/>
  <g transform="translate(256 256) scale(0.8) translate(-256 -256)">
    <path d="M300 74 138 306c-8 11 0 26 14 26h74l-22 100c-4 15 16 24 26 12l162-232c8-11 0-26-14-26h-74l22-100c4-15-16-24-26-12Z"
          fill="url(#mbolt)"/>
  </g>
</svg>
