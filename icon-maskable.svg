<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="TheDiscomBill">
  <!-- Maskable variant: full-bleed square, because Android crops this to whatever shape the
       launcher uses and a pre-rounded tile would be rounded twice. Same tile gradient and
       amber as favicon.svg / icon.svg — all three now derive from .logo-icon-wrap so the tab
       icon, the installed app icon and the header mark are one thing rather than three.

       Deliberately NOT a copy of favicon.svg: the rounded corners, the inset top highlight
       and the 1px rim are all edge treatments that a launcher mask crops away, so they are
       dropped here rather than drawn and thrown out. The bolt keeps the same 22/38 glyph box
       as the favicon, which leaves it about 60% of the visible area after a circular crop —
       inside the 80% safe zone with room to spare. -->
  <defs>
    <linearGradient id="mtile" x1="0.1" y1="-0.07" x2="0.9" y2="1.07">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.7" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <!-- Centred rather than at 30%/20%: a launcher may crop this to a circle, so the lit
         spot is pulled toward the middle where it will survive. -->
    <radialGradient id="msheen" cx="0.42" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="mspark" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="33.7" flood-color="#fbbf24" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="12.35" stdDeviation="6.2" flood-color="#081430" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#mtile)"/>
  <rect width="512" height="512" fill="url(#msheen)"/>

  <g transform="translate(107.8 107.8) scale(12.35)" filter="url(#mspark)">
    <path d="M13 2.5 6.2 13.1c-.27.42.03.95.52.95H11l-1 7.4c-.09.62.72.94 1.07.43L18 11.2c.28-.42-.02-.95-.52-.95H13l1-7.2c.09-.6-.69-.94-1-.55Z"
          fill="#fbbf24" stroke="#fbbf24" stroke-width="1.1" stroke-linejoin="round"/>
  </g>
</svg>
