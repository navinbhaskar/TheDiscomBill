<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="TheDiscomBill">
  <!-- The header mark, rebuilt as a standalone icon. Everything here is derived from
       .logo-icon-wrap in css/styles.css rather than approximated by eye — if that rule
       changes, this file has to change with it.
         tile          linear-gradient(145deg, #3b82f6 0%, #1d4ed8 70%, #1e40af 100%)
         radius        11px on a 38px tile → 28.9% → rx 148 on 512
         sheen         radial-gradient(circle at 30% 20%, #fff .25, transparent 55%)
         top highlight inset 0 1px 0 rgba(255,255,255,.28) → 13.5 units at this scale
         ring          0 0 0 1px rgba(147,197,253,.25)
         bolt          #fbbf24, the SAME 24-viewBox path the header <svg> uses, with its
                       stroke-width 1.1 and round joins, in a 22/38 glyph box → scale 12.35
         glow          drop-shadow(0 0 5px rgba(251,191,36,.55)); CSS blur ≈ 2σ, and 5px
                       across a 22px glyph is 67.4 here, so σ = 33.7
       The 145deg gradient line is converted properly rather than guessed: for a square box
       the CSS gradient line runs |sin θ| + |cos θ| = 1.393 of a side, centred, giving the
       x1/y1 → x2/y2 below. A plain corner-to-corner ramp would be a different angle.

       Two things in the CSS cannot cross over, both of which paint OUTSIDE the tile and
       would simply be clipped here: the outer glow (0 2px 12px rgba(59,130,246,.5)) and the
       hover state. The 1px ring is drawn inside the edge instead of outside it, which reads
       the same once the icon is 32px or smaller. -->
  <defs>
    <linearGradient id="tile" x1="0.1" y1="-0.07" x2="0.9" y2="1.07">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.7" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tileClip">
      <rect width="512" height="512" rx="148"/>
    </clipPath>
    <!-- Both of the header's drop-shadows, chained in the same order the CSS lists them:
         the amber glow, then the dark 0 1px 1px that gives the bolt its edge. CSS blur ≈ 2σ,
         and one glyph unit is 12.35 here, so 1px offset → dy 12.35 and 1px blur → σ 6.2. -->
    <filter id="spark" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="33.7" flood-color="#fbbf24" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="12.35" stdDeviation="6.2" flood-color="#081430" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="148" fill="url(#tile)"/>
  <rect width="512" height="512" rx="148" fill="url(#sheen)"/>
  <!-- inset 0 1px 0 rgba(255,255,255,.28): a lit top edge, clipped to the squircle -->
  <rect width="512" height="13.5" fill="#ffffff" fill-opacity="0.28" clip-path="url(#tileClip)"/>
  <!-- the 1px rim, drawn inside the edge (see note above) -->
  <rect x="6.75" y="6.75" width="498.5" height="498.5" rx="141.25"
        fill="none" stroke="#93c5fd" stroke-opacity="0.25" stroke-width="13.5"/>

  <g transform="translate(107.8 107.8) scale(12.35)" filter="url(#spark)">
    <path d="M13 2.5 6.2 13.1c-.27.42.03.95.52.95H11l-1 7.4c-.09.62.72.94 1.07.43L18 11.2c.28-.42-.02-.95-.52-.95H13l1-7.2c.09-.6-.69-.94-1-.55Z"
          fill="#fbbf24" stroke="#fbbf24" stroke-width="1.1" stroke-linejoin="round"/>
  </g>
</svg>
