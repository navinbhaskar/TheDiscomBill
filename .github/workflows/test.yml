name: tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No dependencies to install — the suite is plain Node ESM.
      - name: Syntax-check all JS files
        run: find js/ -name '*.js' -exec node --check {} +
      - name: Verify generated output is committed (no drift)
        # `npm run seo` is deterministic; if the committed HTML / sitemap / sw.js cache
        # version differ from a fresh build, someone edited a data file without re-running
        # it. Fail loudly so stale pages never ship.
        run: |
          npm run seo
          if ! git diff --quiet; then
            echo "::error::Generated output is out of date. Run 'npm run seo' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi
      - name: Run regression + site integrity tests
        # engine + bill-ocr calculations, plus internal-link integrity and SEO structure
        # (title / single H1 / canonical) across all generated pages.
        run: npm test

  # Tell IndexNow which pages changed, so Bing/Yandex/Seznam/Naver refresh them without
  # waiting for a crawl. Runs only on main, only after the tests above pass, so a broken
  # build is never advertised. Google does not use IndexNow — this is additive to Search
  # Console, not a replacement for it.
  indexnow:
    needs: engine-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The script diffs this push's range, so it needs the parent commit present.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Submit changed pages
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A first push to a branch, or a force-push, reports an all-zero "before" SHA that
          # cannot be diffed. Fall back to the previous commit rather than submitting all 619
          # URLs, which would be a burst of noise for what is usually one changed page.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD~1"
          fi
          node scripts/indexnow.mjs --changed-since "$BEFORE"
